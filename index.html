<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaris One</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  
  <div id="boot-screen" class="overlay flex-center">
    <div class="boot-content">
      <img src="assets/logo.png" alt="Lunaris Logo" class="boot-logo">
      <h1 class="boot-title">Lunaris One</h1>
      <div class="boot-ring"></div>
      <div class="boot-status" id="boot-status-text">Initializing Lunar Core</div>
      <div class="boot-progress">
        <div class="boot-progress-bar" id="boot-progress-bar"></div>
      </div>
    </div>
  </div>

  
  <div id="lock-screen" class="overlay flex-center hidden">
    <div class="lock-bg wallpaper-bg"></div>
    <div class="lock-content">
      <div class="lock-time" id="lock-time">10:00</div>
      <div class="lock-date" id="lock-date">Monday, January 1</div>
      <div class="lock-moon"><i class="ph ph-moon-stars"></i></div>

      <div class="login-panel">
        <div class="user-avatar">
          <i class="ph ph-user"></i>
        </div>
        <div class="user-name">Guest</div>
        <button id="btn-login" class="btn-primary">Sign In</button>
      </div>
    </div>
  </div>

  
  <div id="desktop" class="hidden">
    <div class="desktop-bg wallpaper-bg"></div>

    
    <div class="desktop-icons" id="desktop-icons">
      
    </div>

    
    <div id="windows-container"></div>

    
    <div id="notifications-panel" class="glass-panel hidden">
      <div class="panel-header">
        <h3>Notifications</h3>
        <button id="btn-clear-notifications" class="icon-btn"><i class="ph ph-trash"></i></button>
      </div>
      <div class="notifications-list" id="notifications-list">
        
      </div>
    </div>

    
    <div id="quick-settings-panel" class="glass-panel hidden">
      <div class="quick-settings-grid">
        <div class="qs-toggle active"><i class="ph ph-wifi-high"></i><span>Wi-Fi</span></div>
        <div class="qs-toggle"><i class="ph ph-bluetooth"></i><span>Bluetooth</span></div>
        <div class="qs-toggle" id="toggle-moon-mode"><i class="ph ph-moon"></i><span>Moon Mode</span></div>
        <div class="qs-toggle"><i class="ph ph-airplane"></i><span>Airplane</span></div>
      </div>
      <div class="qs-sliders">
        <div class="slider-row">
          <i class="ph ph-sun"></i>
          <input type="range" min="0" max="100" value="80" class="styled-slider">
        </div>
        <div class="slider-row">
          <i class="ph ph-speaker-high"></i>
          <input type="range" min="0" max="100" value="50" class="styled-slider">
        </div>
      </div>
    </div>

    
    <div id="launcher" class="glass-panel hidden">
      <div class="launcher-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" placeholder="Search apps, files, settings...">
      </div>
      <div class="launcher-section">
        <h4>Pinned Apps</h4>
        <div class="launcher-grid" id="launcher-grid">
          
        </div>
      </div>
    </div>

    
    <div id="taskbar" class="glass-panel">
      <div class="taskbar-left">
        <button id="btn-launcher" class="taskbar-btn logo-btn">
          <img src="assets/logo.png" alt="Start" class="taskbar-logo">
        </button>
      </div>

      <div class="taskbar-center" id="taskbar-apps">
        
      </div>

      <div class="taskbar-right">
        <div class="taskbar-time" id="taskbar-time">10:00 AM</div>
        <div class="taskbar-notifications" id="btn-notifications">
          <i class="ph ph-bell"></i>
        </div>
      </div>
    </div>
  </div>

  
  <div id="context-menu" class="glass-panel hidden">
    <div class="context-item"><i class="ph ph-folder-plus"></i> New Folder</div>
    <div class="context-item"><i class="ph ph-file-plus"></i> New File</div>
    <div class="context-divider"></div>
    <div class="context-item" id="ctx-personalize"><i class="ph ph-palette"></i> Personalize</div>
    <div class="context-item"><i class="ph ph-arrows-clockwise"></i> Refresh</div>
  </div>

  
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audioEngine.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/taskbar.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
